model:
  name: xgboost_alpha
  type: xgboost
  version: "1.0.0"
  task: regression

  parameters:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.05

data:
  dataset: DS-SP500_DAILY-v1.0.0
  features:
    market: true
    news: true
    fundamentals: true

training:
  seed: 42

validation:
  temporal_split: true
  walk_forward: true

promotion:
  require:
    data_quality: pass
    leakage: pass
    validation: pass

artifacts:
  save: true
