model:
  name: lstm_sequence_predictor
  type: lstm
  version: "1.0.0"
  task: forecasting

  parameters:
    input_size: 16
    hidden_size: 64
    num_layers: 2
    dropout: 0.2

data:
  dataset: DS-SP500_DAILY-v1.0.0
  features:
    market: true
    news: true
    fundamentals: false

training:
  seed: 42
  epochs: 10
  batch_size: 64
  learning_rate: 0.001
  early_stopping:
    enabled: true
    patience: 3

validation:
  temporal_split: true
  walk_forward: true

promotion:
  require:
    data_quality: pass
    leakage: pass
    validation: pass

artifacts:
  save: true
