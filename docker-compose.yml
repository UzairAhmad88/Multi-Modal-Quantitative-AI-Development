version: '3.8'

services:
  # FastAPI REST Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant_ai_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://quant_user:quant_password@postgres:5432/quant_db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - postgres
    restart: unless-stopped

  # Streamlit Interactive Research Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant_ai_dashboard
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=production
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: quant_ai_postgres
    environment:
      - POSTGRES_USER=quant_user
      - POSTGRES_PASSWORD=quant_password
      - POSTGRES_DB=quant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # MLflow Experiment Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: quant_ai_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_data:
