model:
  name: transformer_encoder
  type: transformer
  version: "1.0.0"
  task: forecasting

  parameters:
    input_size: 16
    d_model: 64
    nhead: 4
    num_layers: 2

data:
  dataset: DS-SP500_DAILY-v1.0.0
  features:
    market: true
    news: true
    fundamentals: true

training:
  seed: 42
  epochs: 10
  batch_size: 64
  learning_rate: 0.001

validation:
  temporal_split: true
  walk_forward: true

promotion:
  require:
    data_quality: pass
    leakage: pass
    validation: pass

artifacts:
  save: true
