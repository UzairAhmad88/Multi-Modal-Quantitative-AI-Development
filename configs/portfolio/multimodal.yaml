portfolio:
  name: multimodal_portfolio
  method: mean_variance

objective:
  risk_aversion: 2.5
  expected_return_weight: 1.0
  turnover_weight: 0.1

constraints:
  long_only: true
  max_weight: 0.25
  min_weight: 0.00
  max_turnover: 0.25
  max_gross_exposure: 1.0

risk:
  covariance: shrinkage
  target_volatility: 0.15

position_sizing:
  method: fractional_kelly
  kelly_fraction: 0.25

transaction_costs:
  commission_bps: 1
  slippage_bps: 5
