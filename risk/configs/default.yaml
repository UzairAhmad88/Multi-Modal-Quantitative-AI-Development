risk:
  var:
    confidence_level: 0.95
    horizon_days: 1
    method: "historical"

  cvar:
    confidence_level: 0.95
    horizon_days: 1

  monte_carlo:
    simulations: 10000
    random_seed: 42
    distribution: "correlated_normal"

  risk_limits:
    max_volatility: 0.25
    max_var_95: 0.05
    max_cvar_95: 0.08
    max_drawdown: 0.20
    max_leverage: 1.50
